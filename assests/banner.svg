<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <style>
    .float{animation:float 6s ease-in-out infinite}
    .f2{animation-duration:8s;animation-delay:-2s}.f3{animation-duration:7s;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .rise{animation:rise 5s linear infinite;opacity:0}
    .r2{animation-delay:1.7s}.r3{animation-delay:3.3s}
    @keyframes rise{0%{transform:translateY(40px);opacity:0}20%{opacity:.9}100%{transform:translateY(-200px);opacity:0}}
    .tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .d1{animation-delay:.3s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}.d4{animation-delay:1.5s}
    @keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
    .title{font-family:"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",sans-serif;font-weight:800;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
    .pop{animation:pop 3s ease-in-out infinite;transform-origin:380px 120px}
    @keyframes pop{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.02)}}

    .bob{animation:bob 1.6s ease-in-out infinite;transform-origin:100px 160px}
    @keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-10px) scale(1.02,.98)}}
    .shadow{animation:sh 1.6s ease-in-out infinite;transform-origin:100px 182px}
    @keyframes sh{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.78);opacity:.14}}
    .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
    .wave{animation:wave 1.1s ease-in-out infinite;transform-origin:150px 92px}
    @keyframes wave{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-28deg)}}
    .heart{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.95)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e8"/>
      <stop offset=".55" stop-color="#e6d9ff"/>
      <stop offset="1" stop-color="#cdeffc"/>
    </linearGradient>
    <path id="spark" d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4Z"/>
    <path id="heart" d="M0 -4 c-3 -6 -12 -5 -12 2 c0 6 12 12 12 12 c0 0 12 -6 12 -12 c0 -7 -9 -8 -12 -2z"/>
  </defs>

  <rect width="900" height="260" rx="28" fill="url(#bg)"/>

  <!-- soft bubbles -->
  <g fill="#fff" opacity=".45">
    <circle class="float" cx="80" cy="60" r="38"/>
    <circle class="float f2" cx="610" cy="215" r="52"/>
    <circle class="float f3" cx="300" cy="230" r="26"/>
    <circle class="float f2" cx="860" cy="40" r="30"/>
  </g>

  <!-- rising hearts -->
  <g fill="#ff8fb8">
    <g transform="translate(120 250)"><use class="rise" href="#heart"/></g>
    <g transform="translate(560 250) scale(.7)"><use class="rise r2" href="#heart"/></g>
    <g transform="translate(250 250) scale(.55)"><use class="rise r3" href="#heart" fill="#b48ad8"/></g>
  </g>

  <!-- sparkles -->
  <g transform="translate(150 70)"><use class="tw" href="#spark" fill="#ffd36e"/></g>
  <g transform="translate(600 60)"><use class="tw d2" href="#spark" fill="#b48ad8"/></g>
  <g transform="translate(560 170) scale(.7)"><use class="tw d1" href="#spark" fill="#7fd8d2"/></g>
  <g transform="translate(200 190) scale(.8)"><use class="tw d3" href="#spark" fill="#ff8fb8"/></g>
  <g transform="translate(45 150) scale(.6)"><use class="tw d4" href="#spark" fill="#b48ad8"/></g>

  <!-- title -->
  <g class="pop">
    <text x="380" y="132" text-anchor="middle" class="title" font-size="74" fill="#d9558c" stroke-width="12">Checkpoint</text>
    <text x="380" y="180" text-anchor="middle" class="title" font-size="23" fill="#7a5a9a" stroke-width="6">♡ your cozy little game tracker ♡</text>
  </g>

  <!-- Pochi the mascot -->
  <g transform="translate(675 30) scale(1.05)">
    <ellipse class="shadow" cx="100" cy="182" rx="50" ry="7" fill="#c98fbf"/>
    <g class="bob">
      <g class="wave">
        <ellipse cx="170" cy="78" rx="13" ry="11" fill="#e0789f"/>
        <ellipse cx="170" cy="78" rx="10" ry="8" fill="#ffc2da"/>
      </g>
      <path d="M100 74 C96 58 82 52 92 40" fill="none" stroke="#e0789f" stroke-width="4" stroke-linecap="round"/>
      <path class="heart" d="M92 38 c-3 -6 -12 -5 -12 2 c0 6 12 12 12 12 c0 0 12 -6 12 -12 c0 -7 -9 -8 -12 -2z" fill="#ff6f9f"/>
      <g fill="#e0789f">
        <rect x="35" y="67" width="130" height="72" rx="36"/>
        <circle cx="60" cy="136" r="27"/><circle cx="140" cy="136" r="27"/>
      </g>
      <g fill="#ffc2da">
        <rect x="39" y="71" width="122" height="64" rx="32"/>
        <circle cx="60" cy="136" r="23"/><circle cx="140" cy="136" r="23"/>
      </g>
      <ellipse cx="78" cy="82" rx="18" ry="6" fill="#fff" opacity=".55"/>
      <g fill="#b48ad8"><rect x="50" y="94" width="18" height="6" rx="2"/><rect x="56" y="88" width="6" height="18" rx="2"/></g>
      <circle cx="146" cy="90" r="4.5" fill="#7fd8d2"/><circle cx="154" cy="99" r="4.5" fill="#ffd36e"/>
      <circle cx="138" cy="99" r="4.5" fill="#b48ad8"/><circle cx="146" cy="108" r="4.5" fill="#ff8fb8"/>
      <g class="blink"><ellipse cx="87" cy="104" rx="6.5" ry="8.5" fill="#3b2a35"/></g>
      <g class="blink"><ellipse cx="113" cy="104" rx="6.5" ry="8.5" fill="#3b2a35"/></g>
      <circle cx="89.5" cy="100.5" r="2.4" fill="#fff"/><circle cx="115.5" cy="100.5" r="2.4" fill="#fff"/>
      <ellipse cx="76" cy="116" rx="7" ry="4" fill="#ff7aa8" opacity=".55"/>
      <ellipse cx="124" cy="116" rx="7" ry="4" fill="#ff7aa8" opacity=".55"/>
      <path d="M94 115 q3 5 6 0 q3 5 6 0" fill="none" stroke="#3b2a35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
